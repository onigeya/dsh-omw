name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: gates
        run: |
          pnpm constraints
          pnpm typecheck
          pnpm check:deps
          pnpm check:migrations
      - name: tests (linux)
        run: pnpm test
      - name: pack smoke
        run: |
          pnpm build
          pnpm pack:smoke

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: gates
        run: |
          pnpm constraints
          pnpm typecheck
          pnpm check:deps
      - name: OpenSSL 3 for native vector/fts (AD-13)
        run: echo "C:\Program Files\Git\mingw64\bin" >> $env:GITHUB_PATH
      - name: tests (windows, native ABI + wasm)
        run: pnpm test
