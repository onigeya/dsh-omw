name: Upstream Watch

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: check @ladybugdb versions (AD-12 / AD-3 触发器)
        run: node scripts/check-upstream.mjs
